[project]
name = "keeplocal"
version = "0.1.0"
description = "KeepLocal：自托管 AI 工作台，部署在你掌控的边界内，接你自己的模型与受控 MCP 工具，个人可用、企业可控"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Web 与鉴权入口（ADR-002 单运行时形态；与 wcore 的 http extra 同一版本钉口径）
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
# 业务 MCP 服务接入：只用 SDK 的客户端侧（IF-006/IF-007）。
# 与 wcore 的 mcp extra 不同源：wcore 只用服务端侧，其 mcp>=1.22 在 2.x 下会失去 FastMCP。
mcp = [
    "mcp>=2.2,<3",
    "jsonschema>=4.26",
]

[project.scripts]
keeplocal = "keeplocal.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keeplocal = ["templates/*.html", "static/*"]
