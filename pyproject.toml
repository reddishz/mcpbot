[project]
name = "mcpbot"
version = "0.1.0"
description = "自托管单用户 Web Agent：浏览器到本站，本站接外部 Ollama 与业务端 MCP Server"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Web 与鉴权入口（ADR-002 单运行时形态；与 wcore 的 http extra 同一版本钉口径）
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
# 业务 MCP 服务接入（与 wcore 的 mcp extra 同一版本钉口径）
mcp = [
    "mcp>=1.22",
]

[project.scripts]
mcpbot = "mcpbot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpbot = ["templates/*.html", "static/*"]
